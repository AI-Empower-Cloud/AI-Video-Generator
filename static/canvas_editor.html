<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 AI Video Generator - Canvas Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }

        .app-container {
            display: grid;
            grid-template-areas: 
                "toolbar toolbar toolbar"
                "sidebar canvas properties"
                "timeline timeline timeline";
            grid-template-rows: 60px 1fr 200px;
            grid-template-columns: 250px 1fr 250px;
            height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            grid-area: toolbar;
            background: #2d2d2d;
            border-bottom: 1px solid #404040;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
        }

        .toolbar h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .toolbar button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .toolbar button:hover {
            background: #0056b3;
        }

        .toolbar .project-info {
            margin-left: auto;
            font-size: 14px;
            color: #888;
        }

        /* Sidebar */
        .sidebar {
            grid-area: sidebar;
            background: #2d2d2d;
            border-right: 1px solid #404040;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .element-button {
            display: block;
            width: 100%;
            background: #404040;
            color: white;
            border: none;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: background 0.2s;
        }

        .element-button:hover {
            background: #505050;
        }

        .template-section {
            margin-top: 30px;
        }

        .template-button {
            display: block;
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .template-button:hover {
            background: #218838;
        }

        /* Canvas Area */
        .canvas-area {
            grid-area: canvas;
            background: #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        .canvas {
            width: 1920px;
            height: 1080px;
            background: #000000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            border: 2px solid #404040;
            cursor: crosshair;
        }

        .canvas-element {
            position: absolute;
            border: 2px solid transparent;
            cursor: move;
            user-select: none;
        }

        .canvas-element.selected {
            border-color: #007bff;
        }

        .canvas-element.text {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 4px;
        }

        .canvas-element.image {
            background: rgba(0, 123, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        /* Properties Panel */
        .properties {
            grid-area: properties;
            background: #2d2d2d;
            border-left: 1px solid #404040;
            padding: 20px;
            overflow-y: auto;
        }

        .properties h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .property-group {
            margin-bottom: 20px;
        }

        .property-group label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .property-group input,
        .property-group select {
            width: 100%;
            background: #404040;
            border: 1px solid #555;
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Timeline */
        .timeline {
            grid-area: timeline;
            background: #2d2d2d;
            border-top: 1px solid #404040;
            padding: 20px;
        }

        .timeline h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .timeline-tracks {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .timeline-track {
            height: 40px;
            background: #404040;
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }

        .timeline-element {
            position: absolute;
            height: 30px;
            background: #007bff;
            border-radius: 3px;
            color: white;
            font-size: 11px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            cursor: pointer;
        }

        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2d2d2d;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #ffffff;
        }

        .modal-content input {
            width: 100%;
            background: #404040;
            border: 1px solid #555;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        /* Advanced Controls */
        .keyframe-controls {
            margin-top: 15px;
            padding: 10px;
            background: #333;
            border-radius: 4px;
        }

        .keyframe-controls h4 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .keyframe-button {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
        }

        .export-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .export-controls select {
            background: #404040;
            color: white;
            border: 1px solid #555;
            padding: 6px;
            border-radius: 4px;
        }

        .waveform-container {
            margin-top: 10px;
            background: #222;
            border-radius: 4px;
            padding: 10px;
        }

        .waveform {
            width: 100%;
            height: 60px;
            background: #111;
            border-radius: 3px;
        }

        .ai-controls {
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
        }

        .ai-controls h3 {
            color: white;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .ai-input {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .ai-input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .ai-button {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .ai-button:hover {
            background: rgba(255,255,255,0.3);
        }

        .task-progress {
            margin-top: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            padding: 8px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #28a745;
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            color: white;
            font-size: 12px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Toolbar -->
        <div class="toolbar">
            <h1>🎨 Canvas Video Editor</h1>
            <button onclick="newProject()">New Project</button>
            <button onclick="saveProject()">Save</button>
            <div class="export-controls">
                <button onclick="exportVideo()">Export Video</button>
                <select id="export-quality">
                    <option value="medium">Medium Quality</option>
                    <option value="low">Low Quality</option>
                    <option value="high">High Quality</option>
                    <option value="ultra">Ultra Quality</option>
                </select>
            </div>
            <button onclick="showAIGenerator()">🤖 AI Video</button>
            <div class="project-info">
                <span id="project-name">Untitled Project</span> | 
                <span id="project-duration">30s</span>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <h3>Elements</h3>
            <button class="element-button" onclick="addTextElement()">
                📝 Add Text
            </button>
            <button class="element-button" onclick="document.getElementById('image-upload').click()">
                🖼️ Add Image
            </button>
            <button class="element-button" onclick="addVideoElement()">
                🎥 Add Video
            </button>
            <button class="element-button" onclick="addAudioElement()">
                🎵 Add Audio
            </button>
            <button class="element-button" onclick="addShapeElement()">
                🔸 Add Shape
            </button>

            <div class="template-section">
                <h3>Templates</h3>
                <button class="template-button" onclick="useTemplate('social_media_post')">
                    Social Media Post
                </button>
                <button class="template-button" onclick="useTemplate('youtube_intro')">
                    YouTube Intro
                </button>
                <button class="template-button" onclick="useTemplate('educational_video')">
                    Educational Video
                </button>
                <button class="template-button" onclick="useTemplate('podcast_intro')">
                    Podcast Intro
                </button>
            </div>

            <!-- AI Video Generator -->
            <div class="ai-controls">
                <h3>🤖 AI Video Generator</h3>
                <textarea class="ai-input" id="ai-text-input" placeholder="Enter text to convert to video..."></textarea>
                <button class="ai-button" onclick="generateAIVideo()">Generate Video</button>
                <div class="task-progress" id="ai-progress">
                    <div class="progress-text">Generating AI video...</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="ai-progress-fill"></div>
                    </div>
                </div>
            </div>

            <input type="file" id="image-upload" style="display: none;" accept="image/*" onchange="uploadImage(this)">
            <input type="file" id="video-upload" style="display: none;" accept="video/*" onchange="uploadVideo(this)">
            <input type="file" id="audio-upload" style="display: none;" accept="audio/*" onchange="uploadAudio(this)">
        </div>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-area">
            <div class="canvas" id="canvas" onclick="canvasClick(event)">
                <!-- Canvas elements will be dynamically added here -->
            </div>
        </div>

        <!-- Properties Panel -->
        <div class="properties">
            <h3>Properties</h3>
            <div id="properties-content">
                <p style="color: #888;">Select an element to edit properties</p>
            </div>
            
            <!-- Keyframe Controls -->
            <div class="keyframe-controls" id="keyframe-controls" style="display: none;">
                <h4>Animation</h4>
                <button class="keyframe-button" onclick="addKeyframe('opacity')">Add Opacity</button>
                <button class="keyframe-button" onclick="addKeyframe('x')">Add Move X</button>
                <button class="keyframe-button" onclick="addKeyframe('y')">Add Move Y</button>
                <button class="keyframe-button" onclick="addKeyframe('scale')">Add Scale</button>
            </div>

            <!-- Waveform Visualization -->
            <div class="waveform-container" id="waveform-container" style="display: none;">
                <h4 style="color: #fff; margin-bottom: 10px;">Audio Waveform</h4>
                <canvas class="waveform" id="waveform-canvas"></canvas>
            </div>
        </div>

        <!-- Timeline -->
        <div class="timeline">
            <h3>Timeline</h3>
            <div class="timeline-tracks" id="timeline-tracks">
                <!-- Timeline tracks will be dynamically added here -->
            </div>
        </div>
    </div>

    <!-- Status Messages -->
    <div class="status" id="status"></div>

    <!-- New Project Modal -->
    <div class="modal" id="new-project-modal">
        <div class="modal-content">
            <h3>Create New Project</h3>
            <input type="text" id="project-name-input" placeholder="Project Name" value="My Video Project">
            <input type="number" id="project-width" placeholder="Width" value="1920">
            <input type="number" id="project-height" placeholder="Height" value="1080">
            <input type="number" id="project-duration" placeholder="Duration (seconds)" value="30">
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeModal('new-project-modal')">Cancel</button>
                <button class="btn-primary" onclick="createProject()">Create</button>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let currentProject = null;
        let selectedElement = null;
        let elements = [];
        let dragOffset = { x: 0, y: 0 };
        let isDragging = false;

        // API base URL
        const API_BASE = 'http://localhost:8000';

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Create a default project
            createDefaultProject();
        });

        // Project Management
        function newProject() {
            document.getElementById('new-project-modal').style.display = 'block';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        async function createProject() {
            const name = document.getElementById('project-name-input').value;
            const width = parseInt(document.getElementById('project-width').value);
            const height = parseInt(document.getElementById('project-height').value);
            const duration = parseFloat(document.getElementById('project-duration').value);

            try {
                const response = await fetch(`${API_BASE}/canvas/projects`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, width, height, duration })
                });

                const result = await response.json();
                if (result.success) {
                    currentProject = result.project;
                    updateProjectInfo();
                    clearCanvas();
                    showStatus('Project created successfully!');
                    closeModal('new-project-modal');
                }
            } catch (error) {
                showStatus('Failed to create project: ' + error.message, 'error');
            }
        }

        function createDefaultProject() {
            currentProject = {
                id: 'default',
                name: 'Untitled Project',
                width: 1920,
                height: 1080,
                duration: 30
            };
            updateProjectInfo();
        }

        function updateProjectInfo() {
            document.getElementById('project-name').textContent = currentProject.name;
            document.getElementById('project-duration').textContent = currentProject.duration + 's';
        }

        // Element Management
        async function addTextElement() {
            const text = prompt('Enter text:', 'Hello World!');
            if (!text) return;

            if (!currentProject.id || currentProject.id === 'default') {
                // Add locally for demo
                addElementToCanvas({
                    id: 'text_' + Date.now(),
                    type: 'text',
                    x: 400,
                    y: 300,
                    width: 300,
                    height: 60,
                    properties: { text, font_size: 24, color: '#FFFFFF' }
                });
                return;
            }

            try {
                const formData = new FormData();
                formData.append('project_id', currentProject.id);
                formData.append('text', text);
                formData.append('x', '400');
                formData.append('y', '300');
                formData.append('font_size', '24');

                const response = await fetch(`${API_BASE}/canvas/elements/text`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (result.success) {
                    addElementToCanvas(result.element);
                    showStatus('Text element added!');
                }
            } catch (error) {
                showStatus('Failed to add text: ' + error.message, 'error');
            }
        }

        // Advanced Element Functions
        async function addVideoElement() {
            document.getElementById('video-upload').click();
        }

        async function addAudioElement() {
            document.getElementById('audio-upload').click();
        }

        async function addShapeElement() {
            const shapes = ['rectangle', 'circle', 'triangle'];
            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            
            if (!currentProject.id || currentProject.id === 'default') {
                addElementToCanvas({
                    id: 'shape_' + Date.now(),
                    type: 'shape',
                    x: 400,
                    y: 300,
                    width: 200,
                    height: 150,
                    properties: { shape, color: '#007bff' }
                });
                return;
            }

            try {
                const formData = new FormData();
                formData.append('project_id', currentProject.id);
                formData.append('element_type', 'shape');
                formData.append('x', '400');
                formData.append('y', '300');
                formData.append('width', '200');
                formData.append('height', '150');
                formData.append('properties', JSON.stringify({ shape, color: '#007bff' }));

                const response = await fetch(`${API_BASE}/canvas/elements`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (result.success) {
                    addElementToCanvas(result.element);
                    showStatus('Shape element added!');
                }
            } catch (error) {
                showStatus('Failed to add shape: ' + error.message, 'error');
            }
        }

        async function uploadVideo(input) {
            const file = input.files[0];
            if (!file) return;

            if (!currentProject.id || currentProject.id === 'default') {
                addElementToCanvas({
                    id: 'video_' + Date.now(),
                    type: 'video',
                    x: 400,
                    y: 300,
                    width: 400,
                    height: 300,
                    properties: { source: file.name }
                });
                return;
            }

            try {
                const formData = new FormData();
                formData.append('project_id', currentProject.id);
                formData.append('file', file);
                formData.append('x', '400');
                formData.append('y', '300');
                formData.append('width', '400');
                formData.append('height', '300');

                const response = await fetch(`${API_BASE}/canvas/elements/upload`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (result.success) {
                    addElementToCanvas(result.element);
                    showStatus('Video uploaded!');
                }
            } catch (error) {
                showStatus('Failed to upload video: ' + error.message, 'error');
            }
        }

        async function uploadAudio(input) {
            const file = input.files[0];
            if (!file) return;

            if (!currentProject.id || currentProject.id === 'default') {
                const audioElement = {
                    id: 'audio_' + Date.now(),
                    type: 'audio',
                    x: 0,
                    y: 0,
                    width: 0,
                    height: 0,
                    properties: { source: file.name, duration: 30 }
                };
                elements.push(audioElement);
                updateTimeline();
                showWaveform(file.name);
                return;
            }

            try {
                const formData = new FormData();
                formData.append('project_id', currentProject.id);
                formData.append('file', file);

                const response = await fetch(`${API_BASE}/canvas/elements/upload`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (result.success) {
                    elements.push(result.element);
                    updateTimeline();
                    showWaveform(file.name);
                    showStatus('Audio uploaded!');
                }
            } catch (error) {
                showStatus('Failed to upload audio: ' + error.message, 'error');
            }
        }

        // Keyframe Animation
        async function addKeyframe(property) {
            if (!selectedElement) {
                showStatus('Please select an element first', 'error');
                return;
            }

            const time = parseFloat(prompt('Enter time (seconds):', '0'));
            if (isNaN(time)) return;

            let value;
            switch (property) {
                case 'opacity':
                    value = parseFloat(prompt('Enter opacity (0-1):', '1'));
                    break;
                case 'x':
                case 'y':
                    value = parseFloat(prompt(`Enter ${property} position:`, selectedElement[property]));
                    break;
                case 'scale':
                    value = parseFloat(prompt('Enter scale (0.1-5):', '1'));
                    break;
                default:
                    value = prompt(`Enter value for ${property}:`);
            }

            if (!currentProject.id || currentProject.id === 'default') {
                // Store keyframe locally for demo
                if (!selectedElement.keyframes) selectedElement.keyframes = [];
                selectedElement.keyframes.push({ time, property, value });
                showStatus(`Keyframe added for ${property}`);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/canvas/keyframes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: currentProject.id,
                        element_id: selectedElement.id,
                        time,
                        property,
                        value
                    })
                });

                const result = await response.json();
                if (result.success) {
                    showStatus(`Keyframe added for ${property}`);
                }
            } catch (error) {
                showStatus('Failed to add keyframe: ' + error.message, 'error');
            }
        }

        // Waveform Visualization
        async function showWaveform(audioFile) {
            const container = document.getElementById('waveform-container');
            const canvas = document.getElementById('waveform-canvas');
            
            container.style.display = 'block';
            
            try {
                if (currentProject.id && currentProject.id !== 'default') {
                    const response = await fetch(`${API_BASE}/canvas/waveform/${audioFile}?width=800&height=60`);
                    const result = await response.json();
                    
                    if (result.success) {
                        drawWaveform(canvas, result.waveform);
                    }
                } else {
                    // Demo waveform
                    const demoData = Array.from({length: 800}, () => Math.random() * 60);
                    drawWaveform(canvas, demoData);
                }
            } catch (error) {
                console.error('Failed to load waveform:', error);
                // Draw placeholder waveform
                const demoData = Array.from({length: 800}, () => Math.random() * 60);
                drawWaveform(canvas, demoData);
            }
        }

        function drawWaveform(canvas, data) {
            const ctx = canvas.getContext('2d');
            canvas.width = 800;
            canvas.height = 60;
            
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00ff88';
            const barWidth = canvas.width / data.length;
            
            for (let i = 0; i < data.length; i++) {
                const barHeight = data[i];
                const x = i * barWidth;
                const y = (canvas.height - barHeight) / 2;
                
                ctx.fillRect(x, y, barWidth - 1, barHeight);
            }
        }

        // AI Video Generation
        async function generateAIVideo() {
            const text = document.getElementById('ai-text-input').value.trim();
            if (!text) {
                showStatus('Please enter text for AI video generation', 'error');
                return;
            }

            const progressDiv = document.getElementById('ai-progress');
            const progressFill = document.getElementById('ai-progress-fill');
            
            progressDiv.style.display = 'block';
            progressFill.style.width = '0%';

            try {
                const response = await fetch(`${API_BASE}/canvas/ai-video`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text,
                        project_id: currentProject.id !== 'default' ? currentProject.id : null,
                        voice_model: 'xtts',
                        add_lip_sync: true,
                        add_music: true
                    })
                });

                const result = await response.json();
                if (result.success) {
                    // Poll for progress
                    pollAIProgress(result.task_id);
                    if (result.project_id && result.project_id !== currentProject.id) {
                        currentProject.id = result.project_id;
                        updateProjectInfo();
                    }
                }
            } catch (error) {
                showStatus('Failed to start AI video generation: ' + error.message, 'error');
                progressDiv.style.display = 'none';
            }
        }

        async function pollAIProgress(taskId) {
            const progressDiv = document.getElementById('ai-progress');
            const progressFill = document.getElementById('ai-progress-fill');
            
            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}`);
                const task = await response.json();
                
                progressFill.style.width = task.progress + '%';
                
                if (task.status === 'completed') {
                    progressDiv.style.display = 'none';
                    showStatus('AI video generation completed!');
                    loadProjectElements(); // Refresh elements
                } else if (task.status === 'failed') {
                    progressDiv.style.display = 'none';
                    showStatus('AI video generation failed: ' + task.error, 'error');
                } else {
                    // Continue polling
                    setTimeout(() => pollAIProgress(taskId), 2000);
                }
            } catch (error) {
                console.error('Failed to poll progress:', error);
                setTimeout(() => pollAIProgress(taskId), 5000); // Retry after longer delay
            }
        }

        // Export Video
        async function exportVideo() {
            if (!currentProject.id || currentProject.id === 'default') {
                showStatus('Please create a project first', 'error');
                return;
            }

            const quality = document.getElementById('export-quality').value;
            
            try {
                const response = await fetch(`${API_BASE}/canvas/export`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: currentProject.id,
                        quality
                    })
                });

                const result = await response.json();
                if (result.success) {
                    showStatus('Video export started. Check task status for progress.');
                    // Could add progress polling here similar to AI generation
                }
            } catch (error) {
                showStatus('Failed to start video export: ' + error.message, 'error');
            }
        }

        // Timeline Management
        function updateTimeline() {
            const timelineTracks = document.getElementById('timeline-tracks');
            timelineTracks.innerHTML = '';

            // Group elements by layer
            const layers = {};
            elements.forEach(element => {
                const layer = element.layer || 1;
                if (!layers[layer]) layers[layer] = [];
                layers[layer].push(element);
            });

            // Create tracks for each layer
            Object.keys(layers).sort((a, b) => parseInt(b) - parseInt(a)).forEach(layer => {
                const track = document.createElement('div');
                track.className = 'timeline-track';
                track.innerHTML = `<span style="color: #888;">Layer ${layer}</span>`;

                layers[layer].forEach(element => {
                    const timelineElement = document.createElement('div');
                    timelineElement.className = 'timeline-element';
                    
                    const startPercent = (element.start_time || 0) / (currentProject.duration) * 100;
                    const widthPercent = (element.duration || 5) / (currentProject.duration) * 100;
                    
                    timelineElement.style.left = startPercent + '%';
                    timelineElement.style.width = widthPercent + '%';
                    timelineElement.textContent = element.type.charAt(0).toUpperCase() + element.type.slice(1);
                    
                    if (element.type === 'text') {
                        timelineElement.style.background = '#007bff';
                    } else if (element.type === 'image') {
                        timelineElement.style.background = '#28a745';
                    } else if (element.type === 'video') {
                        timelineElement.style.background = '#dc3545';
                    } else if (element.type === 'audio') {
                        timelineElement.style.background = '#ffc107';
                    } else {
                        timelineElement.style.background = '#6c757d';
                    }
                    
                    timelineElement.addEventListener('click', () => {
                        selectElement(element);
                    });

                    track.appendChild(timelineElement);
                });

                timelineTracks.appendChild(track);
            });
        }

        // Template Management
        async function useTemplate(templateName) {
            try {
                const response = await fetch(`${API_BASE}/canvas/templates/${templateName}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_name: `Project from ${templateName}` })
                });

                const result = await response.json();
                if (result.success) {
                    currentProject = result.project;
                    updateProjectInfo();
                    clearCanvas();
                    loadProjectElements();
                    showStatus(`Template "${templateName}" applied!`);
                }
            } catch (error) {
                showStatus('Failed to apply template: ' + error.message, 'error');
            }
        }

        async function loadProjectElements() {
            if (!currentProject.id || currentProject.id === 'default') return;

            try {
                const response = await fetch(`${API_BASE}/canvas/projects/${currentProject.id}`);
                const result = await response.json();
                
                if (result.success && result.project.elements) {
                    clearCanvas();
                    result.project.elements.forEach(element => {
                        addElementToCanvas(element);
                    });
                }
            } catch (error) {
                console.error('Failed to load project elements:', error);
            }
        }

        // Utility Functions
        function clearCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';
            elements = [];
            selectedElement = null;
            updateTimeline();
            
            const propertiesContent = document.getElementById('properties-content');
            propertiesContent.innerHTML = '<p style="color: #888;">Select an element to edit properties</p>';
            
            const keyframeControls = document.getElementById('keyframe-controls');
            keyframeControls.style.display = 'none';
            
            const waveformContainer = document.getElementById('waveform-container');
            waveformContainer.style.display = 'none';
        }

        function canvasClick(event) {
            // Deselect element if clicking on empty canvas
            if (event.target.id === 'canvas') {
                if (selectedElement) {
                    document.getElementById(selectedElement.id).classList.remove('selected');
                    selectedElement = null;
                    
                    const propertiesContent = document.getElementById('properties-content');
                    propertiesContent.innerHTML = '<p style="color: #888;">Select an element to edit properties</p>';
                    
                    const keyframeControls = document.getElementById('keyframe-controls');
                    keyframeControls.style.display = 'none';
                }
            }
        }

        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status';
            
            if (type === 'error') {
                status.style.background = '#dc3545';
            } else {
                status.style.background = '#28a745';
            }
            
            status.style.display = 'block';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        async function saveProject() {
            if (!currentProject.id || currentProject.id === 'default') {
                showStatus('Please create a project first', 'error');
                return;
            }

            showStatus('Project auto-saves with each change');
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 's':
                        e.preventDefault();
                        saveProject();
                        break;
                    case 'd':
                        e.preventDefault();
                        if (selectedElement) {
                            duplicateElement(selectedElement.id);
                        }
                        break;
                    case 'Delete':
                    case 'Backspace':
                        if (selectedElement) {
                            deleteElement(selectedElement.id);
                        }
                        break;
                }
            }
        });

        // Initialize canvas interaction
        document.getElementById('canvas').addEventListener('drop', function(e) {
            e.preventDefault();
            // Handle file drops
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    // Create file input event
                    const input = document.getElementById('image-upload');
                    input.files = files;
                    uploadImage(input);
                } else if (file.type.startsWith('video/')) {
                    const input = document.getElementById('video-upload');
                    input.files = files;
                    uploadVideo(input);
                } else if (file.type.startsWith('audio/')) {
                    const input = document.getElementById('audio-upload');
                    input.files = files;
                    uploadAudio(input);
                }
            }
        });

        document.getElementById('canvas').addEventListener('dragover', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
